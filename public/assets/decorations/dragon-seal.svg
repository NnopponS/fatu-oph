<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Seal Body -->
  <rect x="6" y="6" width="108" height="108" rx="16" fill="url(#sealBg)" stroke="url(#goldBorder)" stroke-width="4"/>
  <!-- Inner Ornamental Inset -->
  <rect x="14" y="14" width="92" height="92" rx="10" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="6,3" opacity="0.85"/>
  <!-- Center Circular Medallion -->
  <circle cx="60" cy="60" r="34" fill="#7f1d1d" stroke="#f59e0b" stroke-width="2.2"/>
  <!-- Imperial Dragon Emblem Symbol -->
  <path d="M60 34 C46 34 38 44 38 56 C38 68 48 76 60 76 C72 76 82 68 82 56 C82 44 74 34 60 34 Z M60 40 C68 40 74 46 74 55 C74 64 67 70 60 70 C53 70 46 64 46 55 C46 46 52 40 60 40 Z" fill="#fde047" opacity="0.9"/>
  <circle cx="60" cy="55" r="7" fill="#fbbf24"/>
  <!-- Seal Typography / Seal Name -->
  <text x="60" y="85" font-family="sans-serif" font-size="8" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1.5">ตรามังกร ๒๕๖๙</text>
  <!-- Corner Studs -->
  <circle cx="22" cy="22" r="3" fill="#fde047"/>
  <circle cx="98" cy="22" r="3" fill="#fde047"/>
  <circle cx="22" cy="98" r="3" fill="#fde047"/>
  <circle cx="98" cy="98" r="3" fill="#fde047"/>
</svg>